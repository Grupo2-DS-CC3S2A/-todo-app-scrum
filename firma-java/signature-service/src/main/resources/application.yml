server:
  port: ${PORT:${SERVER_PORT:8083}}

spring:
  application:
    name: signature-service

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 45MB

signature:
  signed-db-url: ${SIGNED_DB_URL:jdbc:h2:file:./data/signed-documents-db;AUTO_SERVER=FALSE}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8082}
    internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info