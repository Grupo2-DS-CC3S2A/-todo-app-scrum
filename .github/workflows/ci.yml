name: Backend CI

on:
  push:
    branches: ['main', 'developer']
  pull_request:
    branches: ['main', 'developer']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Configura el directorio de trabajo por defecto para todos los comandos run
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Acelera la ejecucion cacheando las dependencias

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar formato con balck
        run: black --check src/

      - name: Analisis con Flake8
        run: flake8 src/

      - name: Verificacion de tipos con Mypy
        run: mypy src/

      - name: Ejecutar pruebas y cobertura (Falla si < 85%)
        run: pytest --cov=src --cov-fail-under=85

  docker-build:
    needs: build-and-test
    if: github.ref == 'refs/heads/developer' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
