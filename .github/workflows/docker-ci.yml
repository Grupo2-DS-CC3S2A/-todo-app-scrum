name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - '**'

env:
  PROJECT_ID: 'mesa-de-partes-501300'
  REGION: 'us-central1'
  SERVICE_NAME: 'todo-app-backend'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      # Autenticarse con Google Cloud usando el secreto
      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # Configurar el SDK de Google Cloud
      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Instalar Supabase CLI de forma nativa
        run: |
          # Descarga e instala la última versión de producción
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin
          supabase --version

      # Sincronizar y subir las migraciones ANTES de desplegar el código nuevo,
      # para que el esquema ya tenga las columnas/tablas que el codigo espera
      # cuando Cloud Run empiece a recibir trafico.
      - name: Ejecutar Migraciones en Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          supabase migration repair --status reverted 20260628230000
          supabase db push

      # signature-service se despliega en un workflow aparte (docker-ci-firma.yml),
      # en otra region. Se resuelve su URL real en vez de hardcodearla o
      # depender de un secreto que haya que actualizar a mano si se re-despliega.
      - name: Obtener URL del signature-service ya desplegado
        id: get-signature-url
        run: |
          URL=$(gcloud run services describe signature-service \
            --region europe-west1 \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Enviar el código directamente a Cloud Build y Cloud Run inyectando los Secrets de GitHub
      - name: Construir y Desplegar en Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./backend \
            --region ${{ env.REGION }} \
            --port 8000 \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }} \
            --set-env-vars "^##^CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}##SECRET_KEY_JWT=${{ secrets.SECRET_KEY_JWT }}##SUPABASE_URL=${{ secrets.SUPABASE_URL }}##SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}##SIGNATURE_SERVICE_URL=${{ steps.get-signature-url.outputs.url }}"
